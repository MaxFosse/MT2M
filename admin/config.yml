# ════════════════════════════════════════════════════════
#  MT2M (Configuration Sveltia CMS)
#  Accès : https://mt2m.vercel.app/admin/
#
#  Florent ne voit que 3 rubriques : ses chantiers, les photos
#  du site et son parcours. Les autres textes (savoir-faire,
#  atelier, contact, mentions légales) sont dans des fichiers
#  que l'admin ne connaît pas : ils ne peuvent pas être cassés.
#  Chaque fichier ci-dessous déclare TOUS ses champs.
# ════════════════════════════════════════════════════════

backend:
  name: github
  repo: MaxFosse/MT2M
  branch: main
  commit_messages:
    update: "Admin : modification de {{path}}"

site_url: https://mt2m.vercel.app
display_url: https://mt2m.vercel.app
logo:
  src: /img/logo.webp

# Tout le dossier img/ est visible dans l'admin : les photos déjà en ligne
# (img/pavillon, img/dole…) s'affichent en aperçu, et Florent peut les réutiliser.
media_folder: img
public_folder: img

# Les photos envoyées sont converties automatiquement en WebP et réduites
media_libraries:
  default:
    config:
      max_file_size: 25000000
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1800
          height: 1800

collections:

  # ══════════════════════════════════════════
  #  1. MES CHANTIERS
  # ══════════════════════════════════════════
  - name: chantiers
    label: "Mes chantiers"
    icon: carpenter
    editor:
      preview: false
    files:
      - name: chantiers
        label: "Mes chantiers"
        file: content/chantiers.json
        fields:
          - name: chantiers
            label: "Chantiers"
            label_singular: "chantier"
            widget: list
            add_to_top: true
            collapsed: true
            summary: "{{fields.titre}} · {{fields.commune}}"
            hint: "Le bouton « Ajouter » crée un nouveau chantier en haut de la liste. Faites glisser un chantier pour changer son ordre."
            fields:

              - name: titre
                label: "Titre du chantier"
                widget: string
                hint: "Ex : Boiseries de la chapelle Notre-Dame-des-Bois"

              - name: lieu
                label: "Bâtiment"
                widget: string
                required: false
                hint: "Ex : Chapelle Notre-Dame-des-Bois"

              - name: commune
                label: "Commune (département)"
                widget: string
                required: false
                hint: "Ex : Dole (Jura)"

              - name: architecte
                label: "Architecte de l'édifice"
                widget: string
                required: false
                hint: "Facultatif. Laissez vide si ce n'est pas utile."

              - name: couverture
                label: "Photo principale"
                widget: image
                choose_url: false
                hint: "La plus belle photo du chantier terminé. Elle s'affiche sur la carte du chantier."

              - name: resume
                label: "Résumé (une ou deux phrases)"
                widget: text
                hint: "S'affiche sous la carte du chantier et en haut de sa fiche."

              - name: contexte
                label: "Histoire du bâtiment et contexte du chantier"
                widget: text
                required: false

              - name: travaux
                label: "Travaux réalisés"
                label_singular: "ligne"
                widget: list
                required: false
                hint: "Une ligne par travail réalisé."
                field: { name: travail, label: "Travail réalisé", widget: string }

              - name: ouvrages
                label: "Photos du chantier, étape par étape"
                label_singular: "ouvrage"
                widget: list
                required: false
                collapsed: true
                summary: "{{fields.titre}}"
                hint: "Un ouvrage = une porte, une fenêtre, une boiserie… Chacun a ses photos dans l'ordre : avant, pendant, après."
                fields:
                  - name: titre
                    label: "Nom de l'ouvrage"
                    widget: string
                    hint: "Ex : Porte intérieure moulurée"
                  - name: texte
                    label: "Courte explication"
                    widget: text
                    required: false
                  - name: etapes
                    label: "Photos, dans l'ordre"
                    label_singular: "photo"
                    widget: list
                    summary: "{{fields.etape}} · {{fields.legende}}"
                    fields:
                      - name: etape
                        label: "Étape"
                        widget: select
                        default: pendant
                        options:
                          - { label: "Avant", value: avant }
                          - { label: "Pendant", value: pendant }
                          - { label: "Après", value: apres }
                      - { name: image, label: "Photo", widget: image, choose_url: false }
                      - { name: legende, label: "Légende", widget: string, hint: "Ex : La porte avant restauration" }

              - name: galerie
                label: "Autres photos (facultatif)"
                label_singular: "photo"
                widget: list
                required: false
                collapsed: true
                hint: "Photos en plus, affichées en bas de la fiche du chantier."
                fields:
                  - { name: image, label: "Photo", widget: image, choose_url: false }
                  - { name: legende, label: "Légende", widget: string }

              - name: id
                label: "Adresse web de la fiche (ne pas toucher)"
                widget: string
                required: false
                hint: "Remplie automatiquement à partir du titre si vous la laissez vide. Ne la modifiez pas sur un chantier existant."

  # ══════════════════════════════════════════
  #  2. PHOTOS DU SITE
  # ══════════════════════════════════════════
  - name: photos
    label: "Photos du site"
    icon: photo_library
    editor:
      preview: false
    files:
      - name: photos
        label: "Photos du site"
        file: content/photos.json
        fields:

          - name: accueil
            label: "Accueil : grande photo"
            widget: object
            fields:
              - { name: image, label: "Photo (format vertical de préférence)", widget: image, choose_url: false }
              - { name: description, label: "Ce qu'on voit sur la photo", widget: string, hint: "Une phrase simple. Utile pour Google et pour les personnes malvoyantes." }
              - { name: etiquette_haut, label: "Étiquette : petite ligne du haut", widget: string, required: false, hint: "Ex : Église Saint-Vincent · Avanne-Aveney" }
              - { name: etiquette_bas, label: "Étiquette : ligne en gras", widget: string, required: false, hint: "Ex : Restitution du décor en bois" }

          - name: savoir_faire
            label: "Savoir-faire : photos des 6 cartes"
            widget: object
            collapsed: true
            fields:
              - name: fenetres
                label: "Carte « Fenêtres, portes et menuiseries anciennes »"
                widget: object
                collapsed: true
                fields: &carte
                  - { name: image, label: "Photo principale", widget: image, choose_url: false }
                  - { name: legende, label: "Légende de la photo principale", widget: string }
                  - name: photos
                    label: "Petites photos en dessous (facultatif)"
                    label_singular: "photo"
                    widget: list
                    required: false
                    hint: "Les 4 premières s'affichent en petit, toutes défilent quand on clique."
                    fields:
                      - { name: image, label: "Photo", widget: image, choose_url: false }
                      - { name: legende, label: "Légende", widget: string }
              - { name: boiseries, label: "Carte « Boiseries et ouvrages d'ébénisterie »", widget: object, collapsed: true, fields: *carte }
              - { name: parquets, label: "Carte « Parquets et planchers anciens »", widget: object, collapsed: true, fields: *carte }
              - { name: greffes, label: "Carte « Greffes et assemblages traditionnels »", widget: object, collapsed: true, fields: *carte }
              - { name: restitution, label: "Carte « Restitution à l'identique »", widget: object, collapsed: true, fields: *carte }
              - { name: monuments, label: "Carte « Édifices patrimoniaux et monuments »", widget: object, collapsed: true, fields: *carte }

          - name: atelier
            label: "L'atelier : photo de présentation"
            widget: object
            collapsed: true
            fields:
              - { name: image, label: "Photo (format vertical de préférence)", widget: image, choose_url: false }
              - { name: legende, label: "Légende", widget: string }

          - name: techniques
            label: "L'atelier : photos des 3 techniques"
            widget: object
            collapsed: true
            fields:
              - name: greffe
                label: "La greffe"
                widget: object
                fields:
                  - { name: image, label: "Photo", widget: image, choose_url: false }
              - name: assemblage
                label: "L'assemblage"
                widget: object
                fields:
                  - { name: image, label: "Photo", widget: image, choose_url: false }
              - name: fabrication
                label: "La fabrication"
                widget: object
                fields:
                  - { name: image, label: "Photo", widget: image, choose_url: false }

  # ══════════════════════════════════════════
  #  3. MON PARCOURS
  # ══════════════════════════════════════════
  - name: parcours
    label: "Mon parcours"
    icon: badge
    editor:
      preview: false
    files:
      - name: parcours
        label: "Mon parcours"
        file: content/parcours.json
        fields:
          - { name: titre, label: "Titre", widget: string, hint: "Ex : Florent Martin, menuisier-ébéniste." }
          - name: etapes
            label: "Étapes du parcours"
            label_singular: "étape"
            widget: list
            summary: "{{fields.titre}}"
            hint: "Dans l'ordre chronologique. Faites glisser pour réorganiser."
            fields:
              - { name: titre, label: "Titre de l'étape", widget: string }
              - { name: texte, label: "Texte", widget: text }
              - { name: lien_texte, label: "Mot du texte à transformer en lien (facultatif)", widget: string, required: false, hint: "Doit être écrit exactement comme dans le texte. Ex : Philippe Bulle" }
              - { name: lien_url, label: "Adresse du lien (facultatif)", widget: string, required: false, hint: "Ex : https://www.philippe-bulle.fr/" }
